<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Myrmidon · 原型评审台</title><style>
*{box-sizing:border-box}body{margin:0;background:#edecf2;color:#252135;font:13px/1.6 system-ui,sans-serif}header{height:64px;padding:0 24px;display:flex;align-items:center;gap:20px;background:#fff;border-bottom:1px solid #dcd9e6}header strong{font-size:16px}header span{color:#6b657c;font-size:11px}select,button,a{font:inherit}select,button{border:1px solid #d2cddd;background:#fff;padding:8px 12px;border-radius:7px;color:#393148}label{display:flex;gap:8px;align-items:center}nav{display:flex;gap:8px;margin-left:auto}button{cursor:pointer}button.on{background:#ede5fa;color:#7138ce;border-color:#7138ce}a{color:#7138ce;text-decoration:none}.stage{padding:30px;overflow:auto;min-height:calc(100vh - 64px)}.frame{width:1440px;height:960px;margin:auto;max-width:none;border:1px solid #d7d1e2;border-radius:12px;overflow:hidden;background:white;box-shadow:0 20px 60px -30px #34304766;transition:width .2s}.frame.phone{border:7px solid #24222b;border-radius:35px;height:844px}.frame.phone iframe{border-radius:26px}iframe{border:0;width:100%;height:100%;display:block}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #7138ce;outline-offset:3px}@media(max-width:850px){header{height:auto;flex-wrap:wrap;padding:15px;gap:10px}header span{display:none}nav{margin-left:0;flex-wrap:wrap}.stage{padding:16px}}@media(prefers-reduced-motion:reduce){.frame{transition:none}}

.route-picker{position:relative}.route-picker summary{list-style:none;cursor:pointer;padding:8px 12px;border:1px solid #d2cddd;border-radius:7px;background:#fff;min-width:155px}.route-picker summary::-webkit-details-marker{display:none}.route-picker>div{position:absolute;top:calc(100% + 6px);left:0;width:230px;max-height:65vh;overflow:auto;background:#fff;border:1px solid #d2cddd;border-radius:9px;padding:5px;box-shadow:0 12px 35px #25213522;z-index:5}.route-picker>div>button{display:block;width:100%;text-align:left;border:0;background:none;min-height:38px}.route-picker>div>button:hover{background:#ede5fa;color:#7138ce}*{scrollbar-width:thin;scrollbar-color:#bca5df transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{border-radius:12px;background:#bca5df;border:2px solid transparent;background-clip:padding-box}
</style></head><body><header><div><strong>Myrmidon</strong> <span>设计评审 · 同一界面，跨端接续</span></div><details class="route-picker"><summary aria-label="选择评审页面"><span id="route-label">工作台</span> ▾</summary><div id="route" role="menu" aria-label="评审页面"></div></details><nav aria-label="设备尺寸"><button data-width="1440" class="on">Web 1440</button><button data-width="1024">平板 1024</button><button data-width="768">平板 768</button><button data-width="390">App 390</button><button data-width="375">App 375</button><a href="./index.html" target="_blank" rel="noopener">独立打开 ↗</a></nav></header><main class="stage"><div class="frame"><iframe title="交互原型预览" src="./index.html#/overview"></iframe></div></main><script>
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.route-picker').open=false});
const routes=[['工作台','/overview'],['协作会话','/chat?channel_id=launch'],['执行会话','/chat?execution_id=W-104'],['项目','/p/launch'],['工作看板','/work?view=board'],['排期日历','/work?view=calendar'],['检查与接受','/p/launch/work-items/W-104?tab=review'],['工作流','/p/launch/flow'],['图片成果','/p/launch/artifacts/W-103'],['软件预览','/p/launch/artifacts/W-104'],['小说编辑','/p/novel/artifacts/W-301'],['视频审片','/p/film/artifacts/W-201'],['组织成员','/members'],['Agent 团队','/agents'],['执行节点','/machines'],['远程终端','/machines/n1?tab=terminal'],['资料记忆','/knowledge'],['目标 OKR','/goals'],['周期报告','/reports'],['工时','/worklogs'],['测试计划','/testplans'],['测试结果','/tests'],['缺陷','/defects'],['仓库','/repositories'],['成本预算','/cost'],['定时','/schedules'],['告警','/health'],['审批','/approvals'],['工具 Skills','/tools'],['专业工作包','/templates'],['模型配置','/models'],['外部连接','/connectors'],['交付回执','/deliveries'],['审计','/governance/audit'],['设置与主题','/settings'],['空态','/work?state=empty'],['异常态','/work?state=error'],['无权限','/work?state=denied']];
const select=document.querySelector('#route'),frame=document.querySelector('.frame'),iframe=document.querySelector('iframe');for(const [label,path] of routes){const option=document.createElement('button');option.type='button';option.setAttribute('role','menuitem');option.textContent=label;option.onclick=()=>{iframe.src='./index.html#'+path;document.querySelector('#route-label').textContent=label;document.querySelector('.route-picker').open=false};select.append(option)}for(const btn of document.querySelectorAll('[data-width]'))btn.onclick=()=>{document.querySelectorAll('[data-width]').forEach(b=>b.classList.remove('on'));btn.classList.add('on');frame.style.width=btn.dataset.width+'px';frame.classList.toggle('phone',Number(btn.dataset.width)<600)};
</script></body></html>
