<!doctype html>
<html lang="zh-CN" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myrmidon 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* ================= Tokens（与 @workspace/ui 语义 Token 同名同义；Aurora 为新增主题） ================= */
:root{
  --font-head:"Space Grotesk","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-body:"DM Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Code",monospace;
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.4,0,1,1);
  --bw:1px;
}
[data-theme="aurora"]{
  --bg:#F7F6FB; --bg-glow:radial-gradient(1200px 600px at 85% -10%,rgba(124,58,237,.10),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(8,145,178,.08),transparent 60%);
  --card:#FFFFFF; --shell:#F0EEF7; --muted:#F1EFF8; --muted-fg:#5B5874; --fg:#1A1830;
  --border:rgba(26,24,48,.09); --border-strong:rgba(26,24,48,.16);
  --primary:#7C3AED; --primary-fg:#FFFFFF; --primary-soft:rgba(124,58,237,.10);
  --info:#0891B2; --info-soft:rgba(8,145,178,.10); --ok:#059669; --ok-soft:rgba(5,150,105,.10);
  --warn:#B45309; --warn-soft:rgba(217,119,6,.12); --danger:#DC2626; --danger-soft:rgba(220,38,38,.09); --stale:#7C7A93;
  --sidebar:rgba(255,255,255,.66); --radius:14px;
  --shadow:0 1px 2px rgba(20,16,40,.04),0 10px 30px -14px rgba(20,16,40,.16);
}
[data-theme="aurora"].dark{
  --bg:#09090F; --bg-glow:radial-gradient(1200px 600px at 85% -10%,rgba(159,122,234,.16),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(34,211,238,.08),transparent 60%);
  --card:#12121A; --shell:#1A1A25; --muted:#1C1C28; --muted-fg:#9C99B3; --fg:#ECEAF5;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --primary:#A78BFA; --primary-fg:#0D0B18; --primary-soft:rgba(167,139,250,.14);
  --info:#22D3EE; --info-soft:rgba(34,211,238,.12); --ok:#34D399; --ok-soft:rgba(52,211,153,.12);
  --warn:#FBBF24; --warn-soft:rgba(251,191,36,.12); --danger:#F87171; --danger-soft:rgba(248,113,113,.12); --stale:#8A88A0;
  --sidebar:rgba(18,18,26,.7); --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px -14px rgba(0,0,0,.6);
}
/* 底座已有主题（取自 packages/ui/src/themes，Myrmidon 可切换） */
[data-theme="modern"]{--bg:#fafafa;--bg-glow:none;--card:#fff;--shell:#f5f5f5;--muted:#f5f5f5;--muted-fg:#737373;--fg:#171717;--border:#e5e5e5;--border-strong:#d4d4d4;--primary:#171717;--primary-fg:#fafafa;--primary-soft:rgba(23,23,23,.07);--info:#0e7490;--info-soft:rgba(14,116,144,.09);--ok:#15803d;--ok-soft:rgba(21,128,61,.09);--warn:#b45309;--warn-soft:rgba(180,83,9,.1);--danger:#ef4444;--danger-soft:rgba(239,68,68,.09);--stale:#8a8a8a;--sidebar:#f5f5f5;--radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04);--font-head:system-ui,"PingFang SC",sans-serif;--font-body:system-ui,"PingFang SC",sans-serif}
[data-theme="modern"].dark{--bg:#0a0a0a;--card:#171717;--shell:#141414;--muted:#1f1f1f;--muted-fg:#a3a3a3;--fg:#fafafa;--border:#262626;--border-strong:#333;--primary:#fafafa;--primary-fg:#171717;--primary-soft:rgba(250,250,250,.08);--sidebar:#111}
[data-theme="business"]{--bg:#f8fafc;--bg-glow:none;--card:#fff;--shell:#f1f5f9;--muted:#f1f5f9;--muted-fg:#64748b;--fg:#0f172a;--border:#e2e8f0;--border-strong:#cbd5e1;--primary:#6366f1;--primary-fg:#fff;--primary-soft:rgba(99,102,241,.1);--info:#0284c7;--info-soft:rgba(2,132,199,.1);--ok:#059669;--ok-soft:rgba(5,150,105,.1);--warn:#d97706;--warn-soft:rgba(217,119,6,.1);--danger:#dc2626;--danger-soft:rgba(220,38,38,.08);--stale:#94a3b8;--sidebar:#f1f5f9;--radius:12px;--shadow:0 1px 3px rgba(15,23,42,.06)}
[data-theme="business"].dark{--bg:#0b1020;--card:#111827;--shell:#0f172a;--muted:#1e293b;--muted-fg:#94a3b8;--fg:#e2e8f0;--border:#1e293b;--border-strong:#334155;--primary:#818cf8;--primary-fg:#0b1020;--sidebar:#0f172a}
[data-theme="eyeCare"]{--bg:#f4f1e8;--bg-glow:none;--card:#fbf9f2;--shell:#ece7d8;--muted:#ece7d8;--muted-fg:#6b6754;--fg:#2f3a2f;--border:#ddd6c1;--border-strong:#cfc6ab;--primary:#5a7c5a;--primary-fg:#fff;--primary-soft:rgba(90,124,90,.12);--info:#4f7a8a;--info-soft:rgba(79,122,138,.12);--ok:#4d7c3a;--ok-soft:rgba(77,124,58,.12);--warn:#a16207;--warn-soft:rgba(161,98,7,.12);--danger:#b4442f;--danger-soft:rgba(180,68,47,.1);--stale:#8c876f;--sidebar:#ece7d8;--radius:8px;--shadow:none;--font-head:Georgia,"Songti SC",serif}
[data-theme="pinkKawaii"]{--bg:#fff5fa;--bg-glow:radial-gradient(900px 500px at 90% -10%,rgba(232,56,138,.12),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(168,85,247,.10),transparent 60%);--card:rgba(255,255,255,.86);--shell:#ffe8f3;--muted:#ffeef6;--muted-fg:#8a5a75;--fg:#4a1d3a;--border:rgba(232,56,138,.16);--border-strong:rgba(232,56,138,.28);--primary:#e8388a;--primary-fg:#fff;--primary-soft:rgba(232,56,138,.12);--info:#a855f7;--info-soft:rgba(168,85,247,.12);--ok:#10b981;--ok-soft:rgba(16,185,129,.12);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.14);--danger:#e11d48;--danger-soft:rgba(225,29,72,.1);--stale:#b58aa3;--sidebar:rgba(255,255,255,.7);--radius:24px;--shadow:0 10px 30px -12px rgba(232,56,138,.25)}
[data-theme="neoBrutalism"]{--bg:#fffdf5;--bg-glow:none;--card:#fff;--shell:#ffe066;--muted:#f4f0e1;--muted-fg:#333;--fg:#000;--border:#000;--border-strong:#000;--primary:#ff006e;--primary-fg:#fff;--primary-soft:#ffd6e8;--info:#3a86ff;--info-soft:#dbe8ff;--ok:#00a86b;--ok-soft:#d2f5e6;--warn:#ff8c00;--warn-soft:#ffe4c4;--danger:#e00000;--danger-soft:#ffd6d6;--stale:#555;--sidebar:#ffe066;--radius:0px;--shadow:4px 4px 0 #000;--bw:2px;--font-head:"Courier New",monospace;--font-body:"Courier New","PingFang SC",monospace}

/* ================= Base ================= */
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--fg);background:var(--bg);background-image:var(--bg-glow);background-attachment:fixed;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;letter-spacing:-.01em}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-size:12.5px}
.muted{color:var(--muted-fg)} .small{font-size:12.5px} .xs{font-size:11.5px}
[data-lucide]{width:16px;height:16px;flex:none} .ic-lg [data-lucide],[data-lucide].lg{width:20px;height:20px}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= Shell ================= */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.side{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;background:var(--sidebar);backdrop-filter:blur(18px);border-right:var(--bw) solid var(--border);padding:16px 12px 20px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--info));display:grid;place-items:center;color:#fff;font-family:var(--font-head);font-weight:700;font-size:18px;box-shadow:0 6px 18px -6px var(--primary)}
[data-theme="neoBrutalism"] .brand-mark{border:2px solid #000;box-shadow:3px 3px 0 #000}
.brand b{font-family:var(--font-head);font-size:16px;display:block;line-height:1.1} .brand small{color:var(--muted-fg);font-size:11.5px}
.ws{display:flex;align-items:center;gap:10px;padding:9px 10px;border:var(--bw) solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;margin-bottom:10px}
.ws .ava{width:26px;height:26px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-fg);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted-fg);transition:background .16s var(--ease),color .16s var(--ease)}
.nav a:hover{background:var(--muted);color:var(--fg)}
.nav a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
[data-theme="neoBrutalism"] .nav a.on{background:#fff;border:2px solid #000;box-shadow:3px 3px 0 #000;color:#000}
.nav a .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px}
.nav a .tag{margin-left:auto;font-size:10px;border:1px solid var(--border-strong);border-radius:999px;padding:0 6px;color:var(--muted-fg)}
.side-foot{margin-top:auto;padding:10px;border:var(--bw) dashed var(--border-strong);border-radius:12px;font-size:12px;color:var(--muted-fg)}
.main{min-width:0;display:flex;flex-direction:column}
.top{grid-column:1/-1;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:57px;padding:0 20px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:var(--bw) solid var(--border)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted-fg);font-size:13px;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--fg);font-weight:600}
.search{flex:1;max-width:340px;margin:0 0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border:var(--bw) solid var(--border);border-radius:12px;background:var(--card);color:var(--muted-fg);cursor:pointer}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.search kbd{margin-left:auto;font-family:var(--font-mono);font-size:11px;border:1px solid var(--border-strong);border-radius:6px;padding:0 6px}
.tools{display:flex;align-items:center;gap:6px}
.iconbtn{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:var(--bw) solid transparent;background:transparent;cursor:pointer;color:var(--muted-fg)}
.iconbtn:hover{background:var(--muted);color:var(--fg)}
.iconbtn .dot{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--warn);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-fg);padding:0 8px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.me{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;cursor:pointer}
.view{padding:26px 28px 80px;max-width:1440px;width:100%;margin:0 auto;animation:rise .36s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabbar{display:none}
.top .brand{padding:0 6px 0 0;cursor:pointer;flex:none} .top .brand small{display:block}
.topnav{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.topnav a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;color:var(--muted-fg);font-weight:500;white-space:nowrap;transition:background .16s var(--ease),color .16s var(--ease)}
.topnav a:hover{background:var(--muted);color:var(--fg)}
.topnav a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.proj-select{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:10px;border:var(--bw) solid var(--border);background:var(--card);color:var(--fg);font:inherit;font-size:13px;font-weight:600;cursor:pointer;max-width:200px;flex:none}
.proj-select span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.proj-select:hover{background:var(--muted)}
.proj-menu{width:240px}
.topnav .proj-chip{font-size:12px;font-weight:600;background:var(--card);border:var(--bw) solid var(--border);border-radius:999px;padding:0 8px;color:var(--fg)}
.topnav .proj-switch{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;margin-left:-4px}.topnav .proj-switch:hover{background:var(--muted)}
.topnav a .cnt.chat{background:var(--info-soft,var(--primary-soft));color:var(--info,var(--primary))} .topnav a .cnt.at{background:var(--danger-soft,var(--warn-soft));color:var(--danger,var(--warn))}
.notice-menu{width:340px} .notice-menu .dot-unread{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none}
.iconbtn .dot:empty{display:none}
.topnav a .cnt{font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 7px}
[data-theme="neoBrutalism"] .topnav a.on{background:#fff;border:2px solid #000;box-shadow:3px 3px 0 #000;color:#000}
.side-title{font-family:var(--font-head);font-size:15px;font-weight:600;padding:4px 10px 6px}
.side-domains{display:none}
.crumb-bar{padding:16px 28px 0;max-width:1440px;width:100%;margin:0 auto}
@media (min-width:861px){body.fullbleed .app{grid-template-columns:minmax(0,1fr)} body.fullbleed .side{display:none}}
body.fullbleed .view{padding:0;max-width:none;animation:none} body.fullbleed .crumb-bar{display:none}
.menu-btn{display:none}

/* ================= Primitives ================= */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:600}
.page-head .sub{color:var(--muted-fg);margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:var(--bw) solid var(--border-strong);background:var(--card);cursor:pointer;font-weight:500;transition:transform .16s var(--ease),background .16s var(--ease),box-shadow .16s var(--ease);white-space:nowrap}
.btn:hover{background:var(--muted)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:transparent;box-shadow:0 8px 20px -10px var(--primary)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary .orb{width:22px;height:22px;margin-right:-8px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;transition:transform .2s var(--ease)}
.btn.primary:hover .orb{transform:translate(2px,-1px) scale(1.06)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
[data-theme="neoBrutalism"] .btn{border:2px solid #000;box-shadow:3px 3px 0 #000;border-radius:0}
.grid{display:grid;gap:16px} .grid>*{min-width:0} .g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.shell{background:var(--shell);border:var(--bw) solid var(--border);border-radius:calc(var(--radius) + 6px);padding:5px}
.card{background:var(--card);border:var(--bw) solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.shell>.card{border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
[data-theme="neoBrutalism"] .card{border:2px solid #000;box-shadow:4px 4px 0 #000}
[data-theme="neoBrutalism"] .shell{background:none;border:none;padding:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.card-h h3{font-size:15px;font-weight:600} .card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px 16px 16px}
.row{display:flex;align-items:center;gap:10px} .row.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.sep{height:1px;background:var(--border);margin:12px 0}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--muted);color:var(--muted-fg)}
.badge [data-lucide]{width:13px;height:13px}
.b-info{background:var(--info-soft);color:var(--info)} .b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)} .b-primary{background:var(--primary-soft);color:var(--primary)} .b-stale{background:transparent;color:var(--stale);border:1px dashed var(--stale)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;border:var(--bw) solid var(--border-strong);font-size:12px;cursor:pointer;background:var(--card)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.spin{animation:spin 1.4s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.6s var(--ease) infinite} @keyframes pulse{50%{opacity:.35}}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:600;color:var(--muted-fg);text-align:left;padding:10px 12px;border-bottom:var(--bw) solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:var(--bw) solid var(--border);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--muted)}
.table-wrap{overflow:auto}
.input,.select,textarea{width:100%;height:38px;padding:0 12px;border-radius:10px;border:var(--bw) solid var(--border-strong);background:var(--card);color:var(--fg);font:inherit}
textarea{height:auto;padding:10px 12px;resize:vertical;min-height:84px}
label.f{display:block;font-size:12.5px;font-weight:600;margin:12px 0 6px} label.f .req{color:var(--danger)}
.hint{font-size:12px;color:var(--muted-fg);margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:var(--bw) solid var(--border);margin-bottom:16px;overflow:auto}
.tabs button{border:none;background:none;padding:10px 12px;cursor:pointer;color:var(--muted-fg);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--primary);font-weight:600}
.empty{display:grid;place-items:center;text-align:center;padding:36px 16px;color:var(--muted-fg);gap:8px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px} .kv dt{color:var(--muted-fg)} .kv dd{margin:0}
.progress{height:6px;border-radius:999px;background:var(--muted);overflow:hidden} .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--info));border-radius:inherit}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--muted);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.danger{background:var(--danger-soft);color:var(--danger)} .note.info{background:var(--info-soft);color:var(--info)} .note.ok{background:var(--ok-soft);color:var(--ok)}

/* ================= Domain components ================= */
.avatar{width:28px;height:28px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none;position:relative}
.avatar.h{border-radius:50%} .avatar.a{border-radius:8px;image-rendering:pixelated} .avatar.c{border-radius:50%;background:var(--muted)!important;color:var(--muted-fg)}
