name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -p=1

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: checks
            cache-path: |
              apps/backend-api/go.sum
              apps/backend-api/tools/go.sum
          - gate: coverage
            cache-path: apps/backend-api/go.sum
          - gate: integration
            cache-path: |
              apps/backend-api/go.sum
              apps/backend-api/tests/go.sum
    services:
      mysql:
        image: ${{ matrix.gate == 'integration' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: integration
        ports: ['3306/tcp']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=30
      postgres:
        image: ${{ matrix.gate == 'integration' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: integration
        ports: ['5432/tcp']
        options: >-
          --health-cmd="pg_isready -U postgres -d integration"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: apps/backend-api
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: apps/backend-api/go.mod
          # Distinct gate keys prevent the first finisher from freezing an
          # incomplete shared build cache for all three jobs.
          cache-dependency-path: ${{ matrix.cache-path }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.gate != 'coverage'
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        if: matrix.gate != 'coverage'
        with:
          bun-version: 1.3.12
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: matrix.gate != 'coverage'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/frontend-web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frontend contract tooling
        if: matrix.gate != 'coverage'
        run: cd ../frontend-web && bun install --frozen-lockfile
      - name: Install Chromium for browser-backed integration tests
        if: matrix.gate == 'integration'
        run: bun run --cwd ../frontend-web/apps/web playwright install --with-deps chromium
      - name: Format, lint and frozen migration checks
        if: matrix.gate == 'checks'
        run: make fmt-check lint schema-lock-check
      - name: Build, OpenAPI and frontend contract checks
        if: matrix.gate == 'checks'
        run: make build openapi-check frontend-contract-check
      - name: Full cross-package coverage and all module floors
        if: matrix.gate == 'coverage'
        run: make test-coverage
      - name: Full integration suite including architecture
        if: matrix.gate == 'integration'
        run: make test-integration
      - name: Configure deterministic MySQL migration settings
        if: matrix.gate == 'integration'
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -e "SET GLOBAL sql_mode='ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'; SET GLOBAL log_bin_trust_function_creators=ON;"
      - name: Real MySQL 8 migration gate
        if: matrix.gate == 'integration'
        env:
          MYSQL8_DSN: root@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/integration?parseTime=true&multiStatements=true&charset=utf8mb4
          MYSQL8_EXPECTED_SQL_MODE: ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
        run: go -C tests test ./migration -count=1 -timeout=45m
      - name: Real database lifecycle and archive integration
        if: matrix.gate == 'integration'
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          for engine in mysql postgres; do
            export IAM_LIFECYCLE_DATABASE_TYPE="$engine"
            if [[ "$engine" == mysql ]]; then
              export IAM_LIFECYCLE_DATABASE_DSN="root@tcp(127.0.0.1:${MYSQL_PORT})/integration?parseTime=true&multiStatements=true&charset=utf8mb4"
            else
              export IAM_LIFECYCLE_DATABASE_DSN="postgres://postgres@127.0.0.1:${POSTGRES_PORT}/integration?sslmode=disable"
            fi
            go test ./internal/integration/iam -run '^TestIAMLifecycleExternalDatabase$' -count=1 -v
            go test ./internal/iam/audit -run '^TestArchiveExternalDatabase$' -count=1 -v
          done

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/frontend-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('apps/frontend-web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:api-types --force
      - run: bun run typecheck --force
      - run: bun run lint --force
      - name: Install Chromium for browser-backed tests
        run: bun run --cwd apps/web playwright install --with-deps chromium
      - run: bun run test --force
      - run: bun run build --force

  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/runner
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: apps/runner/go.mod
          # This module has no external Go dependencies (and no go.sum).
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: npm run test:package
      - name: Verify linked release version
        run: |
          go build -trimpath -ldflags='-X main.version=v0.0.0-ci' -o "$RUNNER_TEMP/machine-runner" ./cmd/runner
          test "$("$RUNNER_TEMP/machine-runner" --version)" = v0.0.0-ci
