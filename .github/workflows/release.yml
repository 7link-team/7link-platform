name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0 or v0.1.0-rc.1)
        required: true
        type: string
      desktop_only:
        description: Build and verify desktop only, without publishing a release
        required: false
        default: false
        type: boolean
      images_only:
        description: Verify native images with unique verify tags, without changing release tags
        required: false
        default: false
        type: boolean
      append_desktop:
        description: Append missing Unix desktop assets to an existing release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}-${{ inputs.images_only && 'images' || inputs.desktop_only && 'desktop' || 'publish' }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}
      repository: ${{ steps.meta.outputs.repository }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      created: ${{ steps.meta.outputs.created }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        name: Resolve an existing tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          DESKTOP_ONLY: ${{ inputs.desktop_only }}
          IMAGES_ONLY: ${{ inputs.images_only }}
          APPEND_DESKTOP: ${{ inputs.append_desktop }}
        shell: bash
        run: |
          set -euo pipefail
          modes=0
          for mode in "$DESKTOP_ONLY" "$IMAGES_ONLY" "$APPEND_DESKTOP"; do
            [[ "$mode" != true ]] || modes=$((modes + 1))
          done
          if (( modes > 1 )); then echo '::error::Select at most one verification or append mode'; exit 1; fi
          # Docker tags cannot contain SemVer build metadata (+).
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          (( ${#TAG} <= 128 ))
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          prerelease=false
          [[ "$TAG" != *-* ]] || prerelease=true
          image_tag=$TAG
          if [[ "$IMAGES_ONLY" == true ]]; then image_tag="verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
          {
            echo "tag=$TAG"
            echo "sha=$sha"
            echo "image=ghcr.io/${OWNER,,}/${REPOSITORY,,}"
            echo "repository=$REPOSITORY"
            echo "prerelease=$prerelease"
            echo "created=$(git show -s --format=%cI "$sha")"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

  image_builds:
    if: ${{ !inputs.desktop_only && !inputs.append_desktop }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
        arch: [amd64, arm64]
        include:
          - component: api
            context: apps/backend-api
          - component: web
            context: apps/frontend-web
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}-${{ matrix.component }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Require a native builder
        env:
          MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$MACHINE"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.metadata.outputs.tag }}
            REVISION=${{ needs.metadata.outputs.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            CREATED=${{ needs.metadata.outputs.created }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - name: Run the image on its native architecture
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Architecture}}')" = "$ARCH"
          if [[ "$COMPONENT" == api ]]; then
            docker run --rm "$IMAGE@$DIGEST" --help
          else
            docker run --rm --env API_UPSTREAM=http://127.0.0.1:8080 "$IMAGE@$DIGEST" nginx -t
          fi
      - name: Export immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 3

  images:
    if: ${{ !inputs.desktop_only && !inputs.append_desktop }}
    needs: [metadata, image_builds]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}-${{ matrix.component }}
      IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-${{ matrix.component }}-*
          path: digests
          merge-multiple: true
      - id: merge
        name: Merge both native images with their attestations
        env:
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          IMAGES_ONLY: ${{ inputs.images_only }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(digests/*)
          [[ ${#files[@]} == 2 ]]
          sources=()
          for file in "${files[@]}"; do
            digest=${file##*/}
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          # Buildx flattens the platform indexes, retaining SBOM/provenance manifests.
          docker buildx imagetools create --dry-run "${sources[@]}" > index.json
          python3 - <<'PY'
          import json
          data = json.load(open('index.json'))
          manifests = data['manifests']
          runtimes = [m for m in manifests if m.get('platform', {}).get('os') == 'linux']
          assert len(runtimes) == 2
          assert {m['platform']['architecture'] for m in runtimes} == {'amd64', 'arm64'}
          attestations = [m for m in manifests if m.get('annotations', {}).get('vnd.docker.reference.type') == 'attestation-manifest']
          assert len(attestations) == 2 and len(manifests) == 4
          assert {m['annotations']['vnd.docker.reference.digest'] for m in attestations} == {m['digest'] for m in runtimes}
          PY
          tags=(--tag "$IMAGE:$IMAGE_TAG")
          if [[ "$PRERELEASE" == false && "$IMAGES_ONLY" != true ]]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.0
      - name: Sign image index by digest (keyless OIDC)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  runner:
    if: ${{ !inputs.desktop_only && !inputs.images_only && !inputs.append_desktop }}
    needs: metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        os: [windows, linux, darwin]
        arch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -p=1
      TAG: ${{ needs.metadata.outputs.tag }}
      REPOSITORY: ${{ needs.metadata.outputs.repository }}
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: apps/runner/go.mod
          cache: false
      - name: Build and archive versioned native binary
        working-directory: apps/runner
        run: |
          set -euo pipefail
          mkdir -p out dist
          binary=machine-runner
          [[ "$GOOS" != windows ]] || binary=machine-runner.exe
          platform=$GOOS
          [[ "$GOOS" != darwin ]] || platform=macos
          go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=$TAG" -o "out/$binary" ./cmd/runner
          if [[ "$GOOS/$GOARCH" == linux/amd64 ]]; then
            [[ "$(out/machine-runner --version)" == "$TAG" ]]
          fi
          asset="${REPOSITORY}-runner_${TAG}_${platform}_${GOARCH}"
          if [[ "$GOOS" == windows ]]; then
            (cd out && zip "../dist/$asset.zip" "$binary")
          else
            tar -C out -czf "dist/$asset.tar.gz" "$binary"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/runner/dist/*
          if-no-files-found: error
          retention-days: 3

  desktop_web:
    if: ${{ !inputs.images_only }}
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12
      - name: Build the shared production desktop Web once
        working-directory: apps/frontend-web
        env:
          VITE_API_URL: /api
        run: |
          bun install --frozen-lockfile
          bun run --cwd apps/web build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundled-web
          path: apps/frontend-web/apps/web/dist/
          if-no-files-found: error
          retention-days: 3

  desktop:
    if: ${{ !inputs.images_only && !inputs.append_desktop }}
    needs: [metadata, desktop_web]
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/frontend-app
        shell: pwsh
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
      DESKTOP_WEB_DIST: ${{ github.workspace }}/desktop-web
      REPOSITORY: ${{ needs.metadata.outputs.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: apps/backend-api/go.mod
          cache-dependency-path: apps/backend-api/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundled-web
          path: desktop-web
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12
      - name: Install locked desktop dependencies
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }
      - name: Test runtime server address rules
        run: |
          bun run test
          if ($LASTEXITCODE -ne 0) { throw 'Desktop launcher tests failed' }
      - name: Prepare Windows Rust target
        run: rustup target add x86_64-pc-windows-msvc
      - id: desktop-build
        name: Build versioned NSIS installer and portable archive
        env:
          DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $metadataJSON = cargo metadata --no-deps --locked --format-version 1 --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve desktop Cargo metadata' }
          $metadata = $metadataJSON | ConvertFrom-Json
          $packages = @($metadata.packages | Where-Object { $metadata.workspace_default_members -contains $_.id })
          $binaries = @($packages.targets | Where-Object { $_.kind -contains 'bin' })
          if ($packages.Count -ne 1 -or $binaries.Count -ne 1) { throw 'Expected one desktop package and binary' }
          $config = Join-Path $env:RUNNER_TEMP 'desktop-release.json'
          node scripts/release-updates.mjs config $config
          if ($LASTEXITCODE -ne 0) { throw 'Updater release configuration failed' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing key is required' }
          bun run build --ci --target x86_64-pc-windows-msvc --bundles nsis --config $config -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          $releaseDir = Join-Path $metadata.target_directory 'x86_64-pc-windows-msvc/release'
          $binary = Get-Item -LiteralPath (Join-Path $releaseDir ($binaries[0].name + '.exe'))
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $releaseDir 'bundle/nsis') -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $dist = New-Item -ItemType Directory -Path dist -Force
          $asset = "$($env:REPOSITORY)-desktop_$($env:TAG)_windows_amd64"
          Copy-Item -LiteralPath $installers[0].FullName -Destination (Join-Path $dist.FullName "$asset-setup.exe")
          Copy-Item -LiteralPath ($installers[0].FullName + '.sig') -Destination (Join-Path $dist.FullName "$asset-setup.exe.sig")
          $archive = Join-Path $dist.FullName "${asset}_portable.zip"
          $portable = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'desktop-portable')
          Copy-Item -LiteralPath $binary.FullName -Destination $portable.FullName
          Copy-Item -LiteralPath src-tauri/resources/local -Destination (Join-Path $portable.FullName 'local') -Recurse
          Compress-Archive -LiteralPath @((Join-Path $portable.FullName $binary.Name), (Join-Path $portable.FullName 'local')) -DestinationPath $archive
          bun run tauri signer sign --app-version $env:TAG.Substring(1) $archive
          if ($LASTEXITCODE -ne 0) { throw 'Portable update signing failed' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entry = $zip.GetEntry($binary.Name)
            if (-not $entry -or $entry.Length -ne $binary.Length -or -not $zip.GetEntry('local/local-service.exe') -or -not $zip.GetEntry('local/web/index.html')) {
              throw 'Portable archive must contain the real desktop, local service and production Web'
            }
          } finally { $zip.Dispose() }
          $extracted = Join-Path $env:RUNNER_TEMP 'desktop-portable-acceptance'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted
          python scripts/verify-local.py (Join-Path $extracted 'local/local-service.exe') (Join-Path $extracted 'local/web') --name ((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName)
          if ($LASTEXITCODE -ne 0) { throw 'Portable local service acceptance failed' }
          "binary-name=$($binary.Name)" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-amd64
          path: apps/frontend-app/dist/*
          if-no-files-found: error
          retention-days: 3
      - name: Verify both installer scopes and actual uninstall cleanup
        env:
          BINARY_NAME: ${{ steps.desktop-build.outputs.binary-name }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'Installer acceptance is restricted to the disposable Windows Actions runner'
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Both-scope installer acceptance requires the hosted runner administrator token'
          }
          $product = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).productName
          $scopes = @(
            @{ Flag = '/CurrentUser'; Hive = 'HKCU'; Directory = (Join-Path $env:LOCALAPPDATA "Programs/$product") },
            @{ Flag = '/AllUsers'; Hive = 'HKLM'; Directory = (Join-Path $env:ProgramW6432 $product) }
          )
          function Get-DesktopUninstallEntries {
            foreach ($hive in @('HKCU', 'HKLM')) {
              foreach ($branch in @('Software\Microsoft\Windows\CurrentVersion\Uninstall', 'Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall')) {
                $root = "${hive}:\$branch"
                if (-not (Test-Path -LiteralPath $root)) { continue }
                foreach ($key in Get-ChildItem -LiteralPath $root) {
                  $values = Get-ItemProperty -LiteralPath $key.PSPath
                  [pscustomobject]@{
                    Hive = $hive
                    Key = $key.PSPath
                    Name = $key.PSChildName
                    DisplayName = [string]$values.DisplayName
                    Version = [string]$values.DisplayVersion
                    Location = ([string]$values.InstallLocation).Trim().Trim('"').TrimEnd('\')
                    Uninstall = [string]$values.UninstallString
                  }
                }
              }
            }
          }
          $before = @(Get-DesktopUninstallEntries)
          foreach ($scope in $scopes) {
            if (Test-Path -LiteralPath $scope.Directory) { throw "Refusing an existing install directory: $($scope.Directory)" }
            if (@($before | Where-Object { $_.Location -eq $scope.Directory -or $_.DisplayName -eq $product -or $_.Name -eq $product }).Count) {
              throw 'Refusing to touch an existing desktop uninstall entry'
            }
          }
          $setups = @(Get-ChildItem -LiteralPath dist -Filter '*-setup.exe' -File)
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*_portable.zip' -File)
          if ($setups.Count -ne 1 -or $archives.Count -ne 1) { throw 'Expected one installer and portable archive' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archives[0].FullName)
          try {
            $stream = $zip.GetEntry($env:BINARY_NAME).Open()
            $memory = [System.IO.MemoryStream]::new()
            try { $stream.CopyTo($memory); $portableBytes = $memory.ToArray() } finally { $stream.Dispose(); $memory.Dispose() }
          } finally { $zip.Dispose() }
          # Tauri 2.12 patches this one fixed-width marker before NSIS bundling,
          # then restores the original executable used by the portable archive.
          # Require exactly that change; every other byte must still match.
          $encoding = [System.Text.Encoding]::GetEncoding('iso-8859-1')
          $portableText = $encoding.GetString($portableBytes)
          $unbundled = '__TAURI_BUNDLE_TYPE_VAR_UNK'
          $nsis = '__TAURI_BUNDLE_TYPE_VAR_NSS'
          $unbundledCount = [regex]::Matches($portableText, $unbundled).Count
          $nsisCount = [regex]::Matches($portableText, $nsis).Count
          Write-Output "Portable marker counts: UNK=$unbundledCount NSS=$nsisCount; bytes=$($portableBytes.Length); PowerShell=$($PSVersionTable.PSVersion)"
          # The program's bundle-type lookup table may also contain NSS as a
          # constant. Only the unique UNK marker is patched by the bundler.
          if ($unbundledCount -ne 1) {
            throw 'Expected exactly one unbundled Tauri marker in the portable executable'
          }
          $expectedBytes = $encoding.GetBytes($portableText.Replace($unbundled, $nsis))
          $expectedStream = [System.IO.MemoryStream]::new($expectedBytes)
          try { $expectedHash = (Get-FileHash -InputStream $expectedStream -Algorithm SHA256).Hash } finally { $expectedStream.Dispose() }
          # Tauri CLI 2.12.2 enables NSIS 3.11 MultiUser command-line scope selection:
          # https://github.com/tauri-apps/tauri/blob/tauri-cli-v2.12.2/crates/tauri-bundler/src/bundle/windows/nsis/installer.nsi#L114-L128
          # https://github.com/kichik/nsis/blob/v311/Contrib/MultiUser/MultiUser.nsh#L303-L325
          # Do not pass /R (launch app). /NS suppresses shortcut creation.
          foreach ($scope in $scopes) {
            $installed = Start-Process -FilePath $setups[0].FullName -ArgumentList @('/S', '/NS', $scope.Flag) -WindowStyle Hidden -Wait -PassThru
            if ($installed.ExitCode -ne 0) { throw "Installer failed for $($scope.Flag): $($installed.ExitCode)" }
            $entries = @(Get-DesktopUninstallEntries | Where-Object { $_.Location -eq $scope.Directory })
            if ($entries.Count -ne 1 -or $entries[0].Hive -ne $scope.Hive -or $entries[0].DisplayName -ne $product -or $entries[0].Version -ne $env:TAG.Substring(1)) {
              throw "Installer scope, location or version mismatch for $($scope.Flag); refusing manual cleanup"
            }
            $exe = Join-Path $scope.Directory $env:BINARY_NAME
            $uninstaller = Join-Path $scope.Directory 'uninstall.exe'
            if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf) -or $entries[0].Uninstall -ne ('"' + $uninstaller + '"')) {
              throw 'Uninstall command does not point to this verified installation'
            }
            if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ne $expectedHash) {
              throw 'Installed executable differs from the released portable executable'
            }
            $service = Join-Path $scope.Directory 'local/local-service.exe'
            if ((Get-FileHash -LiteralPath $service -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath src-tauri/resources/local/local-service.exe -Algorithm SHA256).Hash) {
              throw 'Installed local service differs from the bundled service'
            }
            python scripts/verify-local.py $service (Join-Path $scope.Directory 'local/web') --name $product
            if ($LASTEXITCODE -ne 0) { throw "Installed local service acceptance failed for $($scope.Flag)" }
            $removed = Start-Process -FilePath $uninstaller -ArgumentList @('/S', $scope.Flag) -WindowStyle Hidden -Wait -PassThru
            if ($removed.ExitCode -ne 0) { throw "Uninstaller failed for $($scope.Flag): $($removed.ExitCode)" }
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            while ((Test-Path -LiteralPath $scope.Directory) -or (Test-Path -LiteralPath $entries[0].Key)) {
              if ([DateTime]::UtcNow -ge $deadline) { throw "Uninstall left files or its registry key for $($scope.Flag)" }
              Start-Sleep -Milliseconds 250
            }
            if (@(Get-DesktopUninstallEntries | Where-Object { $_.Location -eq $scope.Directory }).Count) {
              throw 'Uninstall left a registration for this installation'
            }
            Write-Output "Installed and uninstalled $($scope.Flag): scope, executable hash, files and registry cleanup PASS"
          }
  desktop_unix:
    if: ${{ !inputs.images_only }}
    needs: [metadata, desktop_web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: amd64
            machine: x86_64
            bundle: dmg
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            machine: arm64
            bundle: dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: amd64
            machine: x86_64
            bundle: appimage
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            machine: aarch64
            bundle: appimage
    defaults:
      run:
        working-directory: apps/frontend-app
        shell: bash
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
      DESKTOP_WEB_DIST: ${{ github.workspace }}/desktop-web
      REPOSITORY: ${{ needs.metadata.outputs.repository }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Require the native desktop architecture
        env:
          MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$MACHINE"
      - name: Install Linux desktop build and startup dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth dbus-x11
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: apps/backend-api/go.mod
          cache-dependency-path: apps/backend-api/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundled-web
          path: desktop-web
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.12
      - name: Install locked desktop dependencies and test address rules
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test
          rustup target add "$TARGET"
      - name: Build the versioned native desktop bundle
        env:
          BUNDLE: ${{ matrix.bundle }}
          APPEND_DESKTOP: ${{ inputs.append_desktop }}
          DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/desktop-release.json"
          if [[ "$APPEND_DESKTOP" == true ]]; then
          python3 - "$config" <<'PY'
          import json, os, sys
          config = {'version': os.environ['TAG'][1:]}
          if os.environ['PLATFORM'] == 'macos':
              config['bundle'] = {'macOS': {'signingIdentity': '-'}}
          with open(sys.argv[1], 'w') as output:
              json.dump(config, output)
          PY
          else
            node scripts/release-updates.mjs config "$config"
            [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]
          fi
          bun run build --ci --target "$TARGET" --bundles "$BUNDLE" --config "$config" -- --locked
          shopt -s nullglob
          mkdir -p dist
          if [[ "$PLATFORM" == macos ]]; then
            bundles=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
            extension=dmg
          else
            bundles=(src-tauri/target/"$TARGET"/release/bundle/appimage/*.AppImage)
            extension=AppImage
          fi
          [[ ${#bundles[@]} == 1 ]]
          [[ "${bundles[0]##*/}" == *"_${TAG#v}_"* ]]
          cp "${bundles[0]}" "dist/${REPOSITORY}-desktop_${TAG}_${PLATFORM}_${ARCH}.${extension}"
          if [[ "$APPEND_DESKTOP" != true ]]; then
            if [[ "$PLATFORM" == macos ]]; then
              updates=(src-tauri/target/"$TARGET"/release/bundle/macos/*.app.tar.gz)
              [[ ${#updates[@]} == 1 ]]
              cp "${updates[0]}" "dist/${REPOSITORY}-desktop_${TAG}_${PLATFORM}_${ARCH}.app.tar.gz"
              cp "${updates[0]}.sig" "dist/${REPOSITORY}-desktop_${TAG}_${PLATFORM}_${ARCH}.app.tar.gz.sig"
            else
              cp "${bundles[0]}.sig" "dist/${REPOSITORY}-desktop_${TAG}_${PLATFORM}_${ARCH}.AppImage.sig"
            fi
          fi
      - name: Verify the mounted macOS app and native startup
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          image="dist/${REPOSITORY}-desktop_${TAG}_${PLATFORM}_${ARCH}.dmg"
          hdiutil verify "$image"
          mount="$RUNNER_TEMP/desktop-mount"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$image"
          desktop_pid=''
          trap 'if [[ -n "$desktop_pid" ]]; then kill "$desktop_pid" 2>/dev/null || true; wait "$desktop_pid" 2>/dev/null || true; fi; hdiutil detach "$mount"' EXIT
          shopt -s nullglob
          apps=("$mount"/*.app)
          [[ ${#apps[@]} == 1 ]]
          plist="${apps[0]}/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${TAG#v}"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          binary="${apps[0]}/Contents/MacOS/$executable"
          machine=x86_64
          [[ "$ARCH" != arm64 ]] || machine=arm64
          test "$(lipo -archs "$binary")" = "$machine"
          codesign --verify --deep --strict "${apps[0]}"
          product=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["productName"])')
          python3 scripts/verify-local.py "${apps[0]}/Contents/Resources/local/local-service" "${apps[0]}/Contents/Resources/local/web" --name "$product"
          "$binary" > "$RUNNER_TEMP/desktop-startup.log" 2>&1 &
          desktop_pid=$!
          sleep 5
          cat "$RUNNER_TEMP/desktop-startup.log"
          kill -0 "$desktop_pid"
          echo 'DMG, version, native architecture, ad-hoc signature and startup PASS'
      - name: Verify the Linux AppImage and native startup
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/apps/frontend-app/dist/${REPOSITORY}-desktop_${TAG}_${PLATFORM}_${ARCH}.AppImage"
          chmod +x "$image"
          python3 - "$image" <<'PY'
          import os, struct, sys
          with open(sys.argv[1], 'rb') as source:
              header = source.read(64)
          assert header[:6] == b'\x7fELF\x02\x01'
          assert struct.unpack_from('<H', header, 18)[0] == {'amd64': 62, 'arm64': 183}[os.environ['ARCH']]
          PY
          mkdir "$RUNNER_TEMP/desktop-appimage"
          cd "$RUNNER_TEMP/desktop-appimage"
          "$image" --appimage-extract > /dev/null
          mapfile -t services < <(find squashfs-root -type f -path '*/local/local-service')
          [[ ${#services[@]} == 1 ]]
          product=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["productName"])' "$GITHUB_WORKSPACE/apps/frontend-app/src-tauri/tauri.conf.json")
          python3 "$GITHUB_WORKSPACE/apps/frontend-app/scripts/verify-local.py" "${services[0]}" "$(dirname "${services[0]}")/web" --name "$product"
          set +e
          dbus-run-session -- xvfb-run -a timeout 10s env GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 squashfs-root/AppRun > "$RUNNER_TEMP/desktop-startup.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/desktop-startup.log"
          # A live GUI is terminated only by this test's bounded timeout.
          test "$status" = 124
          echo 'AppImage extraction, native architecture and startup PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/frontend-app/dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    if: ${{ !inputs.desktop_only && !inputs.images_only && !inputs.append_desktop }}
    needs: [metadata, images, runner, desktop, desktop_unix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Require anonymous access to both public GHCR images
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          for component in api web; do
            repository="${IMAGE#ghcr.io/}-${component}"
            message="Make GHCR package ${repository} public in Package settings, then rerun this release. A public source repository does not make its packages public."
            # No GitHub/user credentials: request a token for an anonymous pull only.
            if ! token=$(curl --fail --silent --show-error --get https://ghcr.io/token \
              --data-urlencode service=ghcr.io \
              --data-urlencode "scope=repository:${repository}:pull" | jq --exit-status --raw-output '.token // .access_token'); then
              echo "::error::$message"
              exit 1
            fi
            if ! curl --fail --silent --show-error --output /dev/null \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${repository}/manifests/${TAG}"; then
              echo "::error::$message"
              exit 1
            fi
            unset token
            echo "Anonymous pull verified: ${repository}:${TAG}"
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runner-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: assets
      - name: Checksums and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          CREATED: ${{ needs.metadata.outputs.created }}
        run: |
          set -euo pipefail
          node apps/frontend-app/scripts/release-updates.mjs manifest assets
          cd assets
          # Keep each product's checksum list scoped to its own native assets.
          sha256sum -- "${REPOSITORY}-runner_${TAG}_"*.zip "${REPOSITORY}-runner_${TAG}_"*.tar.gz > "${REPOSITORY}-runner_${TAG}_checksums.txt"
          find . -maxdepth 1 -type f -name "${REPOSITORY}-desktop_${TAG}_*" ! -name '*checksums.txt' -print0 | sort -z | xargs -0 sha256sum > "${REPOSITORY}-desktop_${TAG}_checksums.txt"
          args=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$TAG" "${args[@]}" ./*
  desktop_update_feed:
    if: ${{ !inputs.desktop_only && !inputs.images_only && !inputs.append_desktop }}
    needs: [metadata, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - name: Publish signed desktop update feed after the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/desktop-update-feed"
          gh release download "$TAG" --pattern "${REPOSITORY}-desktop_${TAG}_updates.json" --dir "$RUNNER_TEMP/desktop-update-feed"
          node apps/frontend-app/scripts/release-updates.mjs publish "$RUNNER_TEMP/desktop-update-feed/${REPOSITORY}-desktop_${TAG}_updates.json"

  append_desktop:
    if: ${{ inputs.append_desktop }}
    needs: [metadata, desktop_unix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-assets
      - name: Preserve published binaries and append verified Unix desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPOSITORY: ${{ needs.metadata.outputs.repository }}
          EXPECTED_SHA: ${{ needs.metadata.outputs.sha }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)

          def sha256(path):
              digest = hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          tag, repo, name = os.environ['TAG'], os.environ['GH_REPO'], os.environ['REPOSITORY']
          obj = json.loads(gh('api', f'repos/{repo}/git/ref/tags/{tag}'))['object']
          while obj['type'] == 'tag':
              obj = json.loads(gh('api', f'repos/{repo}/git/tags/{obj["sha"]}'))['object']
          assert obj['type'] == 'commit' and obj['sha'] == os.environ['EXPECTED_SHA'], 'Release tag changed'
          release = json.loads(gh('release', 'view', tag, '--json', 'tagName,isDraft,isPrerelease,assets'))
          assert release['tagName'] == tag and not release['isDraft']
          assert release['isPrerelease'] == (os.environ['PRERELEASE'] == 'true')
          published = {asset['name'] for asset in release['assets']}
          prefix = f'{name}-desktop_{tag}_'
          checksum = prefix + 'checksums.txt'
          unix_checksum = prefix + 'unix_checksums.txt'
          windows = {prefix + 'windows_amd64-setup.exe', prefix + 'windows_amd64_portable.zip'}
          unix = {prefix + f'{platform}_{arch}.{extension}' for platform, extension in [('macos', 'dmg'), ('linux', 'AppImage')] for arch in ['amd64', 'arm64']}
          expected = windows | unix
          assert windows | {checksum} <= published, 'Existing Windows release is incomplete'
          assert {asset for asset in published if asset.startswith(prefix)} <= expected | {checksum, unix_checksum}, 'Unexpected desktop asset'
          incoming = Path('desktop-assets')
          assert {path.name for path in incoming.iterdir()} == unix, 'Missing or unexpected Unix build artifacts'
          existing = Path('published-desktop')
          existing.mkdir()
          gh('release', 'download', tag, '--pattern', checksum, '--dir', str(existing))
          def read_checksums(path, allowed):
              checksums = {}
              for line in path.read_text().splitlines():
                  digest, filename = line.split(maxsplit=1)
                  filename = filename.lstrip(' *')
                  assert re.fullmatch(r'[0-9a-f]{64}', digest) and filename in allowed and filename not in checksums
                  checksums[filename] = digest
              return checksums

          old = read_checksums(existing / checksum, expected)
          assert windows <= old.keys() and old.keys() <= published, 'Existing checksum manifest is incomplete'
          if unix_checksum in published:
              gh('release', 'download', tag, '--pattern', unix_checksum, '--dir', str(existing))
              previous_unix = read_checksums(existing / unix_checksum, unix)
              assert previous_unix.keys() == unix and previous_unix.keys() <= published
              assert all(filename not in old or old[filename] == digest for filename, digest in previous_unix.items())
              old.update(previous_unix)
          final, uploads = {}, []
          # Validate every existing payload BEFORE making any release changes.
          for filename in sorted(expected):
              if filename in published:
                  gh('release', 'download', tag, '--pattern', filename, '--dir', str(existing))
                  actual = sha256(existing / filename)
                  if filename in old:
                      assert actual == old[filename], f'Published checksum mismatch: {filename}'
                  else:
                      assert filename in unix and actual == sha256(incoming / filename), f'Unlisted existing asset differs: {filename}'
                  final[filename] = actual
              else:
                  assert filename in unix, f'Missing published Windows asset: {filename}'
                  final[filename] = sha256(incoming / filename)
                  uploads.append(filename)
          for filename in uploads:
              # Never overwrite any existing binary, including on a retry.
              gh('release', 'upload', tag, str(incoming / filename))
          if not unix <= old.keys():
              output = Path('checksums')
              output.mkdir()
              manifest = ''.join(f'{final[filename]}  {filename}\n' for filename in sorted(unix))
              (output / unix_checksum).write_text(manifest)
              # Appending a new list preserves every previously published asset.
              gh('release', 'upload', tag, str(output / unix_checksum))
          print(f'Preserved all published assets; added {len(uploads)} Unix assets; Unix desktop checksums verified')
          PY
