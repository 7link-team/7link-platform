# Load into the deployment's Prometheus rule_files. Route iam-scim alerts to the
# SCIM operator; an unavailable remote directory must not evict login servers.
# iam-workers alerts cover background jobs whose failures have no caller,
# including webhook delivery. files covers the file cleanup loop, and
# operation-log covers operation log events that never reached storage.
groups:
  - name: domain-events
    rules:
      - alert: DomainEventSequencerLagging
        expr: domain_events_sequencer_lag_seconds > 60
        labels:
          severity: warning
        annotations:
          summary: Domain event sequencing is more than one minute behind
          description: Inspect the sequencer worker and database connectivity. Committed events are waiting for a stream sequence; downstream consumers cannot receive them yet.
      - alert: NotificationSMTPConsecutiveFailures
        expr: notification_smtp_consecutive_failures >= 10
        labels:
          severity: warning
        annotations:
          summary: Ten consecutive SMTP attempts have failed
          description: Check the configured SMTP endpoint, credentials and TLS settings. A successful SMTP attempt resets this process-local count; inspect delivery records for affected recipients.
  - name: iam-scim
    rules:
      - alert: IAMSCIMUnresolvedOperation
        expr: max by (job) (iam_scim_unfinished_operations) > 0 and max by (job) (iam_scim_oldest_operation_age_seconds) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SCIM operation has an unresolved remote outcome
          description: Inspect the target operation token and provider evidence using iam-scim-operations.md. Never expire or clear the claim based only on elapsed time.
      - alert: IAMSCIMReconciliationFailing
        expr: max by (job) (iam_scim_failed_targets) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: SCIM targets continue to fail reconciliation
          description: Check remote connectivity, credentials and target synchronization state. Authentication readiness is intentionally independent.
      - alert: IAMSCIMMetricsUnavailable
        expr: iam_scim_metrics_database_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: SCIM operational state cannot be observed
          description: Restore database access for the metrics probe before treating zero pending or failed targets as healthy.
  - name: iam-workers
    rules:
      - alert: IAMAuditArchiveFailing
        expr: sum by (job) (increase(iam_audit_archive_attempt_failures_total[1h])) + sum by (job) (increase(iam_audit_archive_sweep_failures_total[1h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Background audit archiving is failing
          description: List archive jobs with state failed and their error_code. storage_unavailable means checking object storage reachability, credentials and retention settings; integrity_failed means verifying the tenant audit chain before retrying; sweep failures mean restoring database access. Failed jobs retry with backoff; nothing is lost yet.
      - alert: IAMNotificationDeliveryFailed
        expr: sum by (job) (increase(iam_authn_notification_terminal_failures_total[15m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Activation or recovery notifications were permanently abandoned
          description: Outbox rows reached status failed and will never be delivered. Inspect their last_error, restore the notification endpoint, key or client configuration, then ask affected users to request a new activation or recovery message.
      - alert: IAMNotificationDeliveryDegraded
        expr: sum by (job) (increase(iam_authn_notification_retryable_failures_total[15m])) + sum by (job) (increase(iam_authn_notification_poll_failures_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Notification delivery keeps failing and retrying
          description: Check notification endpoint reachability and response status, and database access for outbox polls. Rows exhaust their attempts and become permanently failed if this persists.
      - alert: IAMWebhookDeliveriesAbandoned
        expr: sum by (job) (increase(iam_webhook_deliveries_abandoned_total[15m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Webhook deliveries were abandoned after their last attempt
          description: Deliveries reached status failed and will not be retried, so their receivers never got those events. List the subscription's deliveries for last_error and tell the tenant which events their endpoint missed.
      - alert: IAMWebhookDeliveryFailing
        expr: sum by (job) (increase(iam_webhook_delivery_failures_total[15m])) / (sum by (job) (increase(iam_webhook_delivery_failures_total[15m])) + sum by (job) (increase(iam_webhook_delivered_total[15m]))) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Most webhook delivery attempts are failing
          description: Failing across most receivers points at this side rather than one tenant's endpoint. Check outbound network and DNS, the webhook outbound policy, the encryption key that opens signing secrets, and database access. Deliveries retry with backoff and are abandoned once their attempts are spent.
      - alert: IAMWebhookDeliveryStalled
        expr: max by (job) (min_over_time(iam_webhook_deliveries_backlog[30m])) > 0 and (sum by (job) (increase(iam_webhook_delivered_total[30m])) + sum by (job) (increase(iam_webhook_delivery_failures_total[30m]))) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Webhook deliveries are owed but none are being attempted
          description: The backlog has stayed above zero with no delivery succeeding or failing. Check that the webhook module is enabled and its worker is running on at least one replica, and that its delivery pass is not failing in the log.
      - alert: IAMWebhookLeasesReclaimed
        expr: sum by (job) (increase(iam_webhook_delivery_leases_reclaimed_total[1h])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Webhook delivery claims expired without an outcome
          description: A worker crashed, was killed, or overran twice webhook http_timeout while holding a delivery. The deliveries were retried; receivers may see a duplicate, which they deduplicate on the Idempotency-Key header. Check for restarts and slow receivers.
      - alert: IAMWebhookMetricsUnavailable
        expr: iam_webhook_metrics_database_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Webhook delivery backlog cannot be observed
          description: Restore database access for the metrics probe before treating a zero webhook backlog as healthy.
  - name: files
    rules:
      - alert: FileCleanupFailing
        expr: sum by (job, task) (increase(files_cleanup_failures_total[15m])) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: File cleanup keeps failing
          description: The cleanup task named in the task label has failed on most ticks. Expired operations stay pinned and orphaned objects stay in storage until it succeeds. Check database access and the configured file storage backend, and the log lines that say the cleanup will retry.
  - name: operation-log
    rules:
      - alert: OperationLogEventsDropped
        expr: sum by (job) (increase(audit_events_dropped_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Operation log events were dropped before reaching storage
          description: The operation log queue was full and events were discarded, so those operations have no record. Check the operation log sinks for slow writes and database access, and the queue size and flush settings.
      - alert: OperationLogEventsFailed
        expr: sum by (job) (increase(audit_events_failed_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Operation log events were rejected by every sink
          description: No sink accepted these events, so those operations have no record. Check audit_sink_errors_total and the log for the sink error, and restore database access or the failing sink.
  - name: platform-source-availability
    rules:
      - alert: JobsClaimContinuouslyFailing
        expr: jobs_claim_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Queue claims have failed continuously for five minutes
          description: Check database connectivity and the queue claim lock. A successful poll, including an empty queue, clears the failure episode. Cancellation during worker shutdown is excluded.
      - alert: AuditS3Unavailable
        expr: iam_audit_s3_available == 0
        labels:
          severity: warning
        annotations:
          summary: Audit S3 storage is unavailable
          description: The last actual audit S3 request failed to reach or access the service. Check endpoint reachability, credentials and bucket permissions. This metric covers audit anchoring, archives and erasure storage only; file storage has no S3 driver.
