rule_files:
  - iam-alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'iam_scim_unfinished_operations{job="iam",instance="a"}'
        values: '1 1 1 1 1 0 0 0'
      - series: 'iam_scim_oldest_operation_age_seconds{job="iam",instance="a"}'
        values: '180 240 300 360 420 0 0 0'
      - series: 'iam_scim_unfinished_operations{job="iam",instance="b"}'
        values: '1 1 1 1 1 0 0 0'
      - series: 'iam_scim_oldest_operation_age_seconds{job="iam",instance="b"}'
        values: '180 240 300 360 420 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: IAMSCIMUnresolvedOperation
        exp_alerts:
          - exp_labels:
              job: iam
              severity: critical
            exp_annotations:
              summary: SCIM operation has an unresolved remote outcome
              description: Inspect the target operation token and provider evidence using iam-scim-operations.md. Never expire or clear the claim based only on elapsed time.
      - eval_time: 6m
        alertname: IAMSCIMUnresolvedOperation
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'iam_scim_failed_targets{job="iam"}'
        values: '1 1 1 1 1 1 1 0 0'
      - series: 'iam_scim_metrics_database_success{job="iam",instance="a"}'
        values: '0 0 0 0 0 0 0 1 1'
    alert_rule_test:
      - eval_time: 6m
        alertname: IAMSCIMReconciliationFailing
        exp_alerts:
          - exp_labels:
              job: iam
              severity: warning
            exp_annotations:
              summary: SCIM targets continue to fail reconciliation
              description: Check remote connectivity, credentials and target synchronization state. Authentication readiness is intentionally independent.
      - eval_time: 3m
        alertname: IAMSCIMMetricsUnavailable
        exp_alerts:
          - exp_labels:
              job: iam
              instance: a
              severity: warning
            exp_annotations:
              summary: SCIM operational state cannot be observed
              description: Restore database access for the metrics probe before treating zero pending or failed targets as healthy.
      - eval_time: 8m
        alertname: IAMSCIMReconciliationFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: IAMSCIMMetricsUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'iam_audit_archive_attempt_failures_total{job="iam",instance="a"}'
        values: '0 0 1x80'
      - series: 'iam_audit_archive_sweep_failures_total{job="iam",instance="a"}'
        values: '0x82'
      - series: 'iam_audit_archive_attempt_failures_total{job="iam-sweep",instance="a"}'
        values: '0x82'
      - series: 'iam_audit_archive_sweep_failures_total{job="iam-sweep",instance="a"}'
        values: '0 0 1x80'
    alert_rule_test:
      - eval_time: 4m
        alertname: IAMAuditArchiveFailing
        exp_alerts: []
      - eval_time: 8m
        alertname: IAMAuditArchiveFailing
        exp_alerts:
          - exp_labels:
              job: iam
              severity: warning
            exp_annotations:
              summary: Background audit archiving is failing
              description: List archive jobs with state failed and their error_code. storage_unavailable means checking object storage reachability, credentials and retention settings; integrity_failed means verifying the tenant audit chain before retrying; sweep failures mean restoring database access. Failed jobs retry with backoff; nothing is lost yet.
          - exp_labels:
              job: iam-sweep
              severity: warning
            exp_annotations:
              summary: Background audit archiving is failing
              description: List archive jobs with state failed and their error_code. storage_unavailable means checking object storage reachability, credentials and retention settings; integrity_failed means verifying the tenant audit chain before retrying; sweep failures mean restoring database access. Failed jobs retry with backoff; nothing is lost yet.
      - eval_time: 75m
        alertname: IAMAuditArchiveFailing
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'iam_authn_notification_terminal_failures_total{job="iam",instance="a"}'
        values: '0 0 1x30'
      - series: 'iam_authn_notification_retryable_failures_total{job="iam",instance="a"}'
        values: '0+1x14 14x30'
      - series: 'iam_authn_notification_poll_failures_total{job="iam",instance="a"}'
        values: '0x45'
      - series: 'iam_authn_notification_terminal_failures_total{job="iam-poll",instance="a"}'
        values: '0x45'
      - series: 'iam_authn_notification_retryable_failures_total{job="iam-poll",instance="a"}'
        values: '0x45'
      - series: 'iam_authn_notification_poll_failures_total{job="iam-poll",instance="a"}'
        values: '0+1x14 14x30'
    alert_rule_test:
      - eval_time: 3m
        alertname: IAMNotificationDeliveryFailed
        exp_alerts:
          - exp_labels:
              job: iam
              severity: critical
            exp_annotations:
              summary: Activation or recovery notifications were permanently abandoned
              description: Outbox rows reached status failed and will never be delivered. Inspect their last_error, restore the notification endpoint, key or client configuration, then ask affected users to request a new activation or recovery message.
      - eval_time: 20m
        alertname: IAMNotificationDeliveryFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: IAMNotificationDeliveryDegraded
        exp_alerts: []
      - eval_time: 12m
        alertname: IAMNotificationDeliveryDegraded
        exp_alerts:
          - exp_labels:
              job: iam
              severity: warning
            exp_annotations:
              summary: Notification delivery keeps failing and retrying
              description: Check notification endpoint reachability and response status, and database access for outbox polls. Rows exhaust their attempts and become permanently failed if this persists.
          - exp_labels:
              job: iam-poll
              severity: warning
            exp_annotations:
              summary: Notification delivery keeps failing and retrying
              description: Check notification endpoint reachability and response status, and database access for outbox polls. Rows exhaust their attempts and become permanently failed if this persists.
      - eval_time: 32m
        alertname: IAMNotificationDeliveryDegraded
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'iam_webhook_deliveries_abandoned_total{job="iam",instance="a"}'
        values: '0 0 1x30'
      - series: 'iam_webhook_deliveries_abandoned_total{job="iam-quiet",instance="a"}'
        values: '0x32'
    alert_rule_test:
      - eval_time: 3m
        alertname: IAMWebhookDeliveriesAbandoned
        exp_alerts:
          - exp_labels:
              job: iam
              severity: warning
            exp_annotations:
              summary: Webhook deliveries were abandoned after their last attempt
              description: Deliveries reached status failed and will not be retried, so their receivers never got those events. List the subscription's deliveries for last_error and tell the tenant which events their endpoint missed.
      - eval_time: 20m
        alertname: IAMWebhookDeliveriesAbandoned
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'iam_webhook_delivery_failures_total{job="iam",instance="a"}'
        values: '0+2x30'
      - series: 'iam_webhook_delivered_total{job="iam",instance="a"}'
        values: '0+1x30'
      - series: 'iam_webhook_delivery_failures_total{job="iam-mostly-ok",instance="a"}'
        values: '0+1x30'
      - series: 'iam_webhook_delivered_total{job="iam-mostly-ok",instance="a"}'
        values: '0+3x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: IAMWebhookDeliveryFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: IAMWebhookDeliveryFailing
        exp_alerts:
          - exp_labels:
              job: iam
              severity: warning
            exp_annotations:
              summary: Most webhook delivery attempts are failing
              description: Failing across most receivers points at this side rather than one tenant's endpoint. Check outbound network and DNS, the webhook outbound policy, the encryption key that opens signing secrets, and database access. Deliveries retry with backoff and are abandoned once their attempts are spent.
  - interval: 1m
    input_series:
      - series: 'iam_webhook_deliveries_backlog{job="iam",instance="a"}'
        values: '5x60'
      - series: 'iam_webhook_delivered_total{job="iam",instance="a"}'
        values: '0x60'
      - series: 'iam_webhook_delivery_failures_total{job="iam",instance="a"}'
        values: '0x60'
      - series: 'iam_webhook_deliveries_backlog{job="iam-busy",instance="a"}'
        values: '5x60'
      - series: 'iam_webhook_delivered_total{job="iam-busy",instance="a"}'
        values: '0x60'
      - series: 'iam_webhook_delivery_failures_total{job="iam-busy",instance="a"}'
        values: '0+1x60'
      - series: 'iam_webhook_deliveries_backlog{job="iam-idle",instance="a"}'
        values: '0x60'
      - series: 'iam_webhook_delivered_total{job="iam-idle",instance="a"}'
        values: '0x60'
      - series: 'iam_webhook_delivery_failures_total{job="iam-idle",instance="a"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: IAMWebhookDeliveryStalled
        exp_alerts: []
      - eval_time: 20m
        alertname: IAMWebhookDeliveryStalled
        exp_alerts:
          - exp_labels:
              job: iam
              severity: warning
            exp_annotations:
              summary: Webhook deliveries are owed but none are being attempted
              description: The backlog has stayed above zero with no delivery succeeding or failing. Check that the webhook module is enabled and its worker is running on at least one replica, and that its delivery pass is not failing in the log.
  - interval: 1m
    input_series:
      - series: 'iam_webhook_delivery_leases_reclaimed_total{job="iam",instance="a"}'
        values: '0 0 1x70'
      - series: 'iam_webhook_metrics_database_success{job="iam",instance="a"}'
        values: '0x10 1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: IAMWebhookLeasesReclaimed
        exp_alerts:
          - exp_labels:
              job: iam
              severity: warning
            exp_annotations:
              summary: Webhook delivery claims expired without an outcome
              description: A worker crashed, was killed, or overran twice webhook http_timeout while holding a delivery. The deliveries were retried; receivers may see a duplicate, which they deduplicate on the Idempotency-Key header. Check for restarts and slow receivers.
      - eval_time: 70m
        alertname: IAMWebhookLeasesReclaimed
        exp_alerts: []
      - eval_time: 6m
        alertname: IAMWebhookMetricsUnavailable
        exp_alerts:
          - exp_labels:
              job: iam
              instance: a
              severity: warning
            exp_annotations:
              summary: Webhook delivery backlog cannot be observed
              description: Restore database access for the metrics probe before treating a zero webhook backlog as healthy.
      - eval_time: 12m
        alertname: IAMWebhookMetricsUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'files_cleanup_failures_total{job="iam",instance="a",task="account_object_collection"}'
        values: '0+1x40'
      - series: 'files_cleanup_failures_total{job="iam",instance="a",task="binding_expiry"}'
        values: '0+0.1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: FileCleanupFailing
        exp_alerts: []
      - eval_time: 25m
        alertname: FileCleanupFailing
        exp_alerts:
          - exp_labels:
              job: iam
              task: account_object_collection
              severity: warning
            exp_annotations:
              summary: File cleanup keeps failing
              description: The cleanup task named in the task label has failed on most ticks. Expired operations stay pinned and orphaned objects stay in storage until it succeeds. Check database access and the configured file storage backend, and the log lines that say the cleanup will retry.
  - interval: 1m
    input_series:
      - series: 'audit_events_dropped_total{job="iam",instance="a"}'
        values: '0 0 1x20'
      - series: 'audit_events_failed_total{job="iam",instance="a"}'
        values: '0x5 2x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: OperationLogEventsDropped
        exp_alerts:
          - exp_labels:
              job: iam
              severity: critical
            exp_annotations:
              summary: Operation log events were dropped before reaching storage
              description: The operation log queue was full and events were discarded, so those operations have no record. Check the operation log sinks for slow writes and database access, and the queue size and flush settings.
      - eval_time: 10m
        alertname: OperationLogEventsDropped
        exp_alerts: []
      - eval_time: 4m
        alertname: OperationLogEventsFailed
        exp_alerts: []
      - eval_time: 7m
        alertname: OperationLogEventsFailed
        exp_alerts:
          - exp_labels:
              job: iam
              severity: critical
            exp_annotations:
              summary: Operation log events were rejected by every sink
              description: No sink accepted these events, so those operations have no record. Check audit_sink_errors_total and the log for the sink error, and restore database access or the failing sink.
      - eval_time: 15m
        alertname: OperationLogEventsFailed
        exp_alerts: []
