syntax = "proto3";

package platform.health.v1;

import "google/api/annotations.proto";

option go_package = "7link.com/platform/internal/infra/health/proto/gen/go/health/v1;healthv1";

service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse) {
    option (google.api.http) = {
      get: "/healthz"
    };
  }
}

message CheckRequest {}

message CheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
