<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{.Title}}</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
       font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
       background: Canvas; color: CanvasText; }
main { width: 100%; max-width: 26rem; padding: 2rem 1.5rem; box-sizing: border-box; }
h1 { font-size: 1.25rem; line-height: 1.4; margin: 0 0 0.5rem; }
p { margin: 0 0 1rem; line-height: 1.5; }
ul { margin: 0 0 1.5rem; padding-left: 1.25rem; }
li { margin-bottom: 0.375rem; line-height: 1.5; }
li code { font-size: 0.875em; opacity: 0.7; }
.actions { display: flex; gap: 0.75rem; }
button { flex: 1; padding: 0.625rem 1rem; font: inherit; font-weight: 600; cursor: pointer;
         border-radius: 0.375rem; border: 1px solid currentColor; background: transparent; color: inherit; }
button[value="allow"] { background: AccentColor; color: AccentColorText; border-color: transparent; }
</style>
</head>
<body>
<main>
<h1>{{.Title}}</h1>
<p>{{.Prompt}}</p>
<ul>
{{range .Scopes}}<li>{{.Description}}{{if .Detail}} <code>{{.Name}}</code>{{end}}</li>
{{end}}</ul>
<form method="post" action="{{.Action}}">
<input type="hidden" name="consent_challenge" value="{{.Challenge}}">
<div class="actions">
<button type="submit" name="decision" value="deny">{{.DenyLabel}}</button>
<button type="submit" name="decision" value="allow">{{.AllowLabel}}</button>
</div>
</form>
</main>
</body>
</html>
